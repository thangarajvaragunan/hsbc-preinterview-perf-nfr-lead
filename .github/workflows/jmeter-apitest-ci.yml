name: HSBC PreInterview - Jmeter CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  THREADS: 25        # concurrent users
  RAMPUP: 120         # seconds
  DURATION: 300       # seconds

jobs:
  run-jmeter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JMeter
        run: |
          JMETER_VERSION=5.6.2

          # Remove any previous JMeter folder
          rm -rf jmeter
          rm -rf apache-jmeter-$JMETER_VERSION
      
          # Download and extract
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-$JMETER_VERSION.tgz
          tar -xzf apache-jmeter-$JMETER_VERSION.tgz
      
          # Rename extracted folder
          mv apache-jmeter-$JMETER_VERSION jmeter
      
          # Verify installation
          ls -la jmeter/bin

      - name: Remove Results file if any
        run:
          rm -f results/results.jtl

      - name: Run JMeter Test
        run: |
          ./jmeter/bin/jmeter \
            -n \
            -t tests/json_holder_public_apis_ci.jmx \
            # -Jusers=${{ env.THREADS }} \
            # -Jrampup=${{ env.RAMPUP }} \
            # -Jduration=${{ env.DURATION }} \
            -l results/results.jtl \
            -e \
            -o results/dashboard   

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pandas
            
      - name: Validate p95 SLA for each API
        run: |
          python3 - << 'EOF'
          import pandas as pd
      
          df = pd.read_csv('results/results.jtl')
      
          # Group by API (sampler label)
          apis = df.groupby('label')
      
          # SLA limit
          SLA_P95 = 800
      
          overall_pass = True
      
          for api_name, api_data in apis:
              p95 = api_data['elapsed'].quantile(0.95)
              print(f"API: {api_name} → p95 = {p95} ms")
      
              if p95 > SLA_P95:
                  print(f"❌ SLA breached for {api_name} (limit: {SLA_P95} ms)")
                  overall_pass = False
              else:
                  print(f"✅ SLA passed for {api_name}")
      
          EOF
          
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results
